zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 76e128a94da34f9b9a8fab0846978388
      template: 'HUAWEI AirEngine WLAN AC by SNMP'
      name: 'HUAWEI AirEngine WLAN AC by SNMP'
      description: |
        Monitors HUAWEI AirEngine wireless LAN Access Controllers (AC) and the APs they manage via SNMP.
        
        - AC-wide client counts
        - AP discovery: state, clients (total / per radio), CPU, memory, temperature, Ethernet traffic, inventory
        - Per-radio client items are created only for radios that actually exist on each AP
        - Item keys use radio IDs (radio0/1/2), so changing a radio's band does not break item history
        
        MIBs used:
        HUAWEI-WLAN-AP-MIB
        HUAWEI-WLAN-AP-RADIO-MIB
        
        Requires Zabbix 7.0 or later.
        For base device monitoring (CPU, memory, interfaces) link "Huawei VRP by SNMP" to the same host.
        
        Based on "Huawei wireless Access Controller (AC)" by João Pires (www.noshut.pt), MIT License.
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 9af79fb33b2a4762a80c1156ffa1bced
          name: ac-users-2.4
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2011.6.139.12.1.2.5.0
          key: ac-users-2.4
          history: 90d
          tags:
            - tag: Application
              value: 'AC Clients'
