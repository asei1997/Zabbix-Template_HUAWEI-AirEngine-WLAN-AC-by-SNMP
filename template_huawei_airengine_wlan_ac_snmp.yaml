                  color: 199C0D
                  item:
                    host: 'HUAWEI AirEngine WLAN AC by SNMP'
                    key: 'ap-clients-radio4-[{#APNAME}-{#SNMPINDEX}]'
            - uuid: 9f5829e64f8b432fb49ffb4067e3c727
              name: 'AP-Temperature-[{#APNAME}]'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 0000DD
                  item:
                    host: 'HUAWEI AirEngine WLAN AC by SNMP'
                    key: 'ap-temp-[{#APNAME}-{#SNMPINDEX}]'
            - uuid: 6398e59b665c4c6498c8101769f65ba4
              name: 'AP-Traffic-[{#APNAME}]'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'HUAWEI AirEngine WLAN AC by SNMP'
                    key: 'ap-eth-download[{#APNAME}-{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: F63100
                  item:
                    host: 'HUAWEI AirEngine WLAN AC by SNMP'
                    key: 'ap-eth-upload[{#APNAME}-{#SNMPINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // walk[] の結果から AP 一覧を作り、各 AP に存在する radio を {#RADIOn}=1/0、その周波数帯を {#RADIOn_BAND} で付与する
                  // Build the AP list from the walk[] result and set {#RADIOn}=1/0 for each radio present on the AP and {#RADIOn_BAND} for its band
                  var AP_NAME = '1.3.6.1.4.1.2011.6.139.13.3.3.1.4.';
                  var AP_ID = '1.3.6.1.4.1.2011.6.139.13.3.3.1.67.';
                  var RADIO_FREQ = '1.3.6.1.4.1.2011.6.139.16.1.2.1.5.';
                  var RADIO_STA = '1.3.6.1.4.1.2011.6.139.16.1.2.1.40.';
                  // hwWlanRadioFreqType: frequency2G(1), frequency5G(2), frequency6G(3)
                  var BANDS = {'1': '2.4GHz', '2': '5GHz', '3': '6GHz'};

                  function parseValue(v) {
                      var m = v.match(/^Hex-STRING: (.*)$/);
                      if (m) {
                          try {
                              return decodeURIComponent(m[1].trim().replace(/\s+/g, '%').replace(/^/, '%'));
                          } catch (e) {
                              return m[1].trim();
                          }
                      }
                      v = v.replace(/^[^:]+: ?/, '');
                      m = v.match(/^"([\s\S]*)"$/);
                      return m ? m[1].replace(/\\(["\\])/g, '$1') : v;
                  }

                  var aps = {}, order = [], radios = {}, bands = {};

                  function ap(idx) {
                      if (!aps[idx]) {
                          aps[idx] = {'{#SNMPINDEX}': idx, '{#APID}': '', '{#APNAME}': ''};
                          order.push(idx);
                      }
                      return aps[idx];
                  }

                  value.split(/\r?\n/).forEach(function (line) {
                      var m = line.match(/^\.?([\d.]+) = ([\s\S]*)$/);
                      if (!m) {
                          return;
                      }
                      var oid = m[1], val = m[2];
                      if (oid.indexOf(AP_NAME) === 0) {
                          ap(oid.substr(AP_NAME.length))['{#APNAME}'] = parseValue(val);
                      }
                      else if (oid.indexOf(AP_ID) === 0) {
                          ap(oid.substr(AP_ID.length))['{#APID}'] = parseValue(val);
                      }
                      else if (oid.indexOf(RADIO_STA) === 0) {
                          // index = <APインデックス(MAC等で複数階層)>.<radio ID> なので末尾だけが radio ID
                          // index = <AP index (multi-part, e.g. MAC)>.<radio ID>, so only the last part is the radio ID
                          radios[oid.substr(RADIO_STA.length)] = true;
                      }
                      else if (oid.indexOf(RADIO_FREQ) === 0) {
                          // 値は "INTEGER: 2" または MIB 読み込み時 "INTEGER: frequency5G(2)" の形式
                          // The value is "INTEGER: 2", or "INTEGER: frequency5G(2)" when the MIB is loaded
                          var n = val.match(/(\d+)\)?\s*$/);
                          if (n) {
                              bands[oid.substr(RADIO_FREQ.length)] = BANDS[n[1]] || 'unknown';
                          }
                      }
                  });

                  return JSON.stringify(order.map(function (idx) {
                      var row = aps[idx], set = '';
                      for (var r = 0; r <= 4; r++) {
                          var key = idx + '.' + r;
                          row['{#RADIO' + r + '}'] = radios[key] ? '1' : '0';
                          row['{#RADIO' + r + '_BAND}'] = bands[key] || 'unknown';
                          if (radios[key]) {
                              set += r;
                          }
                      }
                      // 存在する radio ID を連結した文字列(例: "01", "012")。グラフの出し分けに使う
                      // Concatenated IDs of the radios present (e.g. "01", "012"), used to select the graph
                      row['{#RADIO_SET}'] = set;
                      // グラフ名の末尾に付けるマクロ。AP の radio 構成に合うものは空文字(名前は "AP-Clients-[AP名]")、
                      // 合わないものは "#NOGRAPH" を付け、オーバーライドで作成しない
                      // Suffix macros for graph names: empty for the variant matching the AP's radio set
                      // (name becomes "AP-Clients-[AP name]"), "#NOGRAPH" for the others so an override drops them
                      ['01', '012', '0123', '01234'].forEach(function (g) {
                          row['{#CLIENTS_GRAPH_R' + g + '}'] = (g === set) ? '' : ' #NOGRAPH';
                      });
                      return row;
                  }));
          overrides:
            - name: 'radio0 not present'
              step: '1'
              filter:
                conditions:
                  - macro: '{#RADIO0}'
                    value: ^1$
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: '^ap-clients-[^(]*\(radio0\)-\['
                  discover: NO_DISCOVER
            - name: 'radio1 not present'
              step: '2'
              filter:
                conditions:
                  - macro: '{#RADIO1}'
                    value: ^1$
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: '^ap-clients-[^(]*\(radio1\)-\['
                  discover: NO_DISCOVER
            - name: 'radio2 not present'
              step: '3'
              filter:
                conditions:
                  - macro: '{#RADIO2}'
                    value: ^1$
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: '^ap-clients-[^(]*\(radio2\)-\['
                  discover: NO_DISCOVER
            - name: 'radio3 not present'
              step: '4'
              filter:
                conditions:
                  - macro: '{#RADIO3}'
                    value: ^1$
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: '^ap-clients-[^(]*\(radio3\)-\['
                  discover: NO_DISCOVER
            - name: 'radio4 not present'
              step: '5'
              filter:
                conditions:
                  - macro: '{#RADIO4}'
                    value: ^1$
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: '^ap-clients-[^(]*\(radio4\)-\['
                  discover: NO_DISCOVER
            - name: 'graph: radio set mismatch'
              step: '6'
              filter:
                conditions:
                  - macro: '{#SNMPINDEX}'
                    value: '.*'
                    formulaid: A
              operations:
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: '#NOGRAPH'
                  discover: NO_DISCOVER
        - uuid: e8f1f779207d4774b84b7b4d5d06bad7
          name: 'SSID Discovery'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2011.6.139.17.1.2.1.2]'
          key: wlc.ssid.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SSID}'
                value: '{$SSID.MATCHES}'
                formulaid: A
              - macro: '{#SSID}'
                value: '{$SSID.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 90d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Discovers SSIDs from HUAWEI-WLAN-VAP-MIB::hwWlanSsidStatisticTable. Use {$SSID.MATCHES} / {$SSID.NOT_MATCHES} to select SSIDs.'
          item_prototypes:
            - uuid: 6cdf3952ef7a48fd9972d61edec5ea1c
              name: 'SSID-Clients-[{#SSID}]'
              type: DEPENDENT
              key: 'ssid-clients-[{#SSIDINDEX}]'
              delay: '0'
              history: 90d
              units: Clients
              description: 'Number of clients connected to SSID "{#SSID}" on the whole AC (2.4GHz + 5GHz + 6GHz).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["{#SSIDINDEX}"].clients'
              master_item:
                key: wlc.ssid.clients.raw
              tags:
                - tag: Application
                  value: 'SSID Clients'
            - uuid: f36bbb9b968c4858b90678c607db0d0e
              name: 'SSID-APs-[{#SSID}]'
              type: DEPENDENT
              key: 'ssid-aps-[{#SSIDINDEX}]'
              delay: '0'
              history: 90d
              units: APs
              description: 'Number of APs providing SSID "{#SSID}" (HUAWEI-WLAN-VAP-MIB::hwWlanSsidApCnt).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$["{#SSIDINDEX}"].aps'
              master_item:
                key: wlc.ssid.clients.raw
              tags:
                - tag: Application
                  value: 'SSID Clients'
          graph_prototypes:
            - uuid: 8894334c0ed54b2ebc18b8fc870ff582
              name: 'SSID-Clients-[{#SSID}]'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'HUAWEI AirEngine WLAN AC by SNMP'
                    key: 'ssid-clients-[{#SSIDINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // インデックス(<長さ>.<SSID の各バイト>)から SSID 名を復元する
                  // Decode the SSID name from the index (<length>.<SSID bytes>)
                  var COL = '1.3.6.1.4.1.2011.6.139.17.1.2.1.2.';
                  var rows = [];

                  function decode(bytes) {
                      try {
                          return decodeURIComponent(bytes.map(function (b) {
                              return '%' + ('0' + b.toString(16)).slice(-2);
                          }).join(''));
                      } catch (e) {
                          return String.fromCharCode.apply(null, bytes);
                      }
                  }

                  value.split(/\r?\n/).forEach(function (line) {
                      var m = line.match(/^\.?([\d.]+) = /);
                      if (!m || m[1].indexOf(COL) !== 0) {
                          return;
                      }
                      var idx = m[1].substr(COL.length);
                      var parts = idx.split('.').map(Number);
                      // 先頭が長さでない場合(IMPLIED 形式)は、すべてを SSID のバイトとして扱う
                      // If the first sub-identifier is not the length (IMPLIED index), treat all as SSID bytes
                      var bytes = (parts[0] === parts.length - 1) ? parts.slice(1) : parts;
                      rows.push({'{#SSIDINDEX}': idx, '{#SSID}': decode(bytes)});
                  });

                  return JSON.stringify(rows);
        - uuid: 917f66ac4ef34aa0877603876b8e8139
          name: 'AP SSID Discovery'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2011.6.139.17.1.1.1.6,1.3.6.1.4.1.2011.6.139.13.3.3.1.4]'
          key: wlc.ap.ssid.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SSID}'
                value: '{$SSID.MATCHES}'
                formulaid: A
              - macro: '{#SSID}'
                value: '{$SSID.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 90d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: |
            Discovers AP name x SSID combinations from HUAWEI-WLAN-VAP-MIB::hwWlanVapSSID and HUAWEI-WLAN-AP-MIB::hwWlanApName
            (matched by the AP MAC address at the start of the VAP index).
            {#VAPKEYS} lists the VAPs (one per radio) of each combination; the item sums their client counts.
            Use {$SSID.MATCHES} / {$SSID.NOT_MATCHES} to select SSIDs.
          item_prototypes:
            - uuid: c2131dfbdf224252a82678bf1764fb81
              name: 'AP-SSID-Clients-[{#APNAME}]-[{#SSID}]'
              type: DEPENDENT
              key: 'ap-ssid-clients-[{#APNAME}-{#SSIDINDEX}]'
              delay: '0'
              history: 90d
              units: Clients
              description: 'Number of clients connected to SSID "{#SSID}" on AP {#APNAME} (sum of all radios).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // この AP x SSID に属する VAP の端末数を合計する
                      // Sum the client counts of the VAPs belonging to this AP x SSID
                      var data = JSON.parse(value), keys = [{#VAPKEYS}], sum = 0, found = false;
                      for (var i = 0; i < keys.length; i++) {
                          if (data.hasOwnProperty(keys[i])) {
                              sum += data[keys[i]];
                              found = true;
                          }
                      }
                      // VAP が 1 つも見つからない場合(AP オフラインなど)はエラーにする
                      // Fail when none of the VAPs is present (e.g. the AP is offline)
                      if (!found) {
                          throw 'No VAP found for this AP and SSID';
                      }
                      return sum;
              master_item:
                key: wlc.vap.clients.raw
              tags:
                - tag: Application
                  value: 'AP SSID Clients'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // VAP テーブルの SSID と AP テーブルの AP 名から「AP 名 x SSID」の組み合わせを作り、属する VAP のインデックス一覧を付ける
                  // Build "AP name x SSID" combinations from the VAP SSIDs and the AP table names, with the list of their VAP indexes
                  var SSID_COL = '1.3.6.1.4.1.2011.6.139.17.1.1.1.6.';
                  var APNAME_COL = '1.3.6.1.4.1.2011.6.139.13.3.3.1.4.';

                  function parseValue(v) {
                      var m = v.match(/^Hex-STRING: (.*)$/);
                      if (m) {
                          try {
                              return decodeURIComponent(m[1].trim().replace(/\s+/g, '%').replace(/^/, '%'));
                          } catch (e) {
                              return m[1].trim();
                          }
                      }
                      v = v.replace(/^[^:]+: ?/, '');
                      m = v.match(/^"([\s\S]*)"$/);
                      return m ? m[1].replace(/\\(["\\])/g, '$1') : v;
                  }

                  // SSID を AC 全体の SSID テーブルと同じインデックス形式(<長さ>.<UTF-8 の各バイト>)にする
                  // Encode the SSID in the same index format as the AC-wide SSID table (<length>.<UTF-8 bytes>)
                  function ssidIndex(s) {
                      var bin = unescape(encodeURIComponent(s)), bytes = [];
                      for (var i = 0; i < bin.length; i++) {
                          bytes.push(bin.charCodeAt(i));
                      }
                      return [bytes.length].concat(bytes).join('.');
                  }

                  var ssids = {}, apnames = {};

                  value.split(/\r?\n/).forEach(function (line) {
                      var m = line.match(/^\.?([\d.]+) = ([\s\S]*)$/);
                      if (!m) {
                          return;
                      }
                      if (m[1].indexOf(SSID_COL) === 0) {
                          ssids[m[1].substr(SSID_COL.length)] = parseValue(m[2]);
                      }
                      else if (m[1].indexOf(APNAME_COL) === 0) {
                          apnames[m[1].substr(APNAME_COL.length)] = parseValue(m[2]);
                      }
                  });

                  // AP 名 x SSID ごとに VAP をまとめる(radio が違っても同じ組み合わせ)
                  // Group VAPs per AP name x SSID (VAPs on different radios share a combination)
                  var groups = {}, order = [];
                  Object.keys(ssids).forEach(function (vap) {
                      // VAP インデックス = <AP の MAC>.<radio ID>.<WLAN ID>。先頭(MAC)が AP テーブルのインデックス
                      // VAP index = <AP MAC>.<radio ID>.<WLAN ID>; the MAC part is the AP table index
                      var mac = vap.split('.').slice(0, -2).join('.');
                      var apname = apnames[mac], ssid = ssids[vap];
                      if (!apname || !ssid) {
                          return;
                      }
                      var key = apname + '\u0000' + ssid;
                      if (!groups[key]) {
                          groups[key] = {apname: apname, ssid: ssid, vaps: []};
                          order.push(key);
                      }
                      groups[key].vaps.push(vap);
                  });

                  return JSON.stringify(order.map(function (key) {
                      var g = groups[key];
                      return {
                          '{#APNAME}': g.apname,
                          '{#SSID}': g.ssid,
                          '{#SSIDINDEX}': ssidIndex(g.ssid),
                          // アイテムの JavaScript で配列として使う 'idx1','idx2' 形式 / 'idx1','idx2' list used as an array in the item JavaScript
                          '{#VAPKEYS}': g.vaps.map(function (v) {
                              return "'" + v + "'";
                          }).join(',')
                      };
                  }));
      macros:
        - macro: '{$AP_STATE_CRIT_STATUS}'
          value: '4'
        - macro: '{$AP_STATE_NORMAL_STATUS}'
          value: '8'
        - macro: '{$AP_TEMP_MAX_CRIT_STATUS}'
          value: '65'
        - macro: '{$AP_TEMP_MIN_CRIT_STATUS}'
          value: '-15'
        - macro: '{$SSID.MATCHES}'
          value: '.*'
          description: 'Regular expression of SSIDs to discover.'
        - macro: '{$SSID.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regular expression of SSIDs to exclude.'
      valuemaps:
        - uuid: 8f85fe6e082442e8917f84bbc8885993
          name: ap-state
          mappings:
            - value: '1'
              newvalue: idle
            - value: '2'
              newvalue: committing
            - value: '3'
              newvalue: commit-failed
            - value: '4'
              newvalue: fault(offline)
            - value: '5'
              newvalue: config-failed
            - value: '6'
              newvalue: ver-mismatch
            - value: '7'
              newvalue: downloading
            - value: '8'
              newvalue: normal
            - value: '9'
              newvalue: standby
