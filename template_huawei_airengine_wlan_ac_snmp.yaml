          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2011.6.139.12.1.2.13.0
          key: ac-users-6
          history: 90d
          description: 'HUAWEI-WLAN-GLOBAL-MIB::hwWlanCurAssoc6gStaNum - total number of 6GHz users on the AC.'
          tags:
            - tag: Application
