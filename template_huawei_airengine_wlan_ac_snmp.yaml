        - uuid: 5570115022f3416d8838ba29a2d05a6d
          name: 'SSID clients: raw data'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2011.6.139.17.1.2.1.2,1.3.6.1.4.1.2011.6.139.17.1.2.1.3,1.3.6.1.4.1.2011.6.139.17.1.2.1.4,1.3.6.1.4.1.2011.6.139.17.1.2.1.17]'
          key: wlc.ssid.clients.raw
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            HUAWEI-WLAN-VAP-MIB::hwWlanSsidStatisticTable
            Per SSID: sum of hwWlanSsid2gStaCnt, hwWlanSsid5gStaCnt and hwWlanSsid6gStaCnt, and hwWlanSsidApCnt,
            as JSON {"<SSID index>": {"clients": n, "aps": n}}.
            Master item for the "ssid-clients" and "ssid-aps" item prototypes.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // SSID ごとに 2.4GHz / 5GHz / 6GHz の端末数を合計し、AP 数とあわせて
                  // {"<SSID インデックス>": {"clients": 端末数, "aps": AP 数}} の JSON にする
                  // Per SSID, sum the 2.4GHz / 5GHz / 6GHz client counts and add the AP count, as JSON
                  // {"<SSID index>": {"clients": clients, "aps": APs}}
                  // 6GHz 列(.17)がないファームウェアでも、ある列だけを合計する
                  // On firmware without the 6GHz column (.17), only the available columns are summed
                  var BASE = '1.3.6.1.4.1.2011.6.139.17.1.2.1.';
                  var FIELDS = {'2': 'clients', '3': 'clients', '17': 'clients', '4': 'aps'};
                  var out = {};

                  value.split(/\r?\n/).forEach(function (line) {
                      var m = line.match(/^\.?([\d.]+) = [^:]*: ?(\d+)/);
                      if (!m || m[1].indexOf(BASE) !== 0) {
                          return;
                      }
                      // <列番号>.<SSID インデックス> / <column>.<SSID index>
                      var rest = m[1].substr(BASE.length);
                      var dot = rest.indexOf('.');
                      var field = FIELDS[rest.substr(0, dot)];
                      if (!field) {
                          return;
                      }
                      var idx = rest.substr(dot + 1);
                      if (!out[idx]) {
                          out[idx] = {'clients': 0, 'aps': 0};
                      }
                      out[idx][field] += parseInt(m[2], 10);
                  });

                  return JSON.stringify(out);
          tags:
            - tag: Application
              value: 'SSID Clients'
        - uuid: 1d2a332b38cc4b1982362f73a2d910b4
          name: 'AP SSID clients: raw data'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2011.6.139.17.1.1.1.9]'
          key: wlc.vap.clients.raw
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            HUAWEI-WLAN-VAP-MIB::hwWlanVapStaOnlineCnt per VAP, as JSON {"<VAP index>": clients}.
            VAP index = <AP MAC>.<radio ID>.<WLAN ID>.
            Master item for the "ap-ssid-clients" item prototypes.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // VAP ごとの端末数を {"<VAP インデックス>": 端末数} の JSON にする
                  // Convert the client count per VAP into JSON {"<VAP index>": clients}
                  // VAP インデックス = <AP の MAC>.<radio ID>.<WLAN ID>
                  // VAP index = <AP MAC>.<radio ID>.<WLAN ID>
                  var COL = '1.3.6.1.4.1.2011.6.139.17.1.1.1.9.';
                  var out = {};

                  value.split(/\r?\n/).forEach(function (line) {
                      var m = line.match(/^\.?([\d.]+) = [^:]*: ?(\d+)/);
                      if (m && m[1].indexOf(COL) === 0) {
                          out[m[1].substr(COL.length)] = parseInt(m[2], 10);
                      }
                  });

                  return JSON.stringify(out);
          tags:
            - tag: Application
              value: 'AP SSID Clients'
